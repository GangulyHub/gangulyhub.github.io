name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A54D85: ${{ secrets.A54D85 }}
          B06C06: ${{ secrets.B06C06 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A54D85', '')
          env_b = os.environ.get('B06C06', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- a0a251e2b6d92af02eb7ae7e511c61b00cd92ac3 -->', env_a)
          if env_b:
              result = result.replace('<!-- 2d48970446123953 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
